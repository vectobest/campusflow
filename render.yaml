# Render Blueprint: backend and frontend deployed as two separate services.
#   campusflow-api  Node/Express API  (needs MONGODB_URI)
#   campusflow-web  static React site (built with the API's address)
# Each service is told the other's address automatically via fromService.
# Deploy: https://render.com/deploy?repo=https://github.com/vectobest/campusflow
services:
  - type: web
    name: campusflow-api
    runtime: node
    region: singapore              # closest Render region to Raipur
    plan: free
    buildCommand: npm ci --workspace server --include-workspace-root
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true        # strong random secret, created by Render
      - key: MONGODB_URI
        sync: false                # paste your MongoDB Atlas connection string
      - key: CORS_ORIGINS          # only the frontend may call the API from a browser
        fromService:
          type: web
          name: campusflow-web
          property: host
      - key: STUDY_CONTACT
        sync: false
      - key: ETHICS_APPROVAL_REF
        sync: false
      - key: GOOGLE_CLIENT_ID       # OAuth 2.0 Web client ID (public); empty = Google sign-in hidden
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS # optional, e.g. nitrr.ac.in
        sync: false
      - key: MIN_AGGREGATE_PARTICIPANTS
        value: "3"
      - key: RETENTION_DAYS
        value: "365"

  - type: web
    name: campusflow-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: client/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_HOST         # baked into the build: https://<host>/api/v1
        fromService:
          type: web
          name: campusflow-api
          property: host
    routes:
      - type: rewrite              # client-side routing: every path serves the app
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://*.onrender.com https://*.vercel.app https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
