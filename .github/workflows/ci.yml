name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: npm ci
      - run: npm run setup:analytics
      - name: Server tests
        run: npm test -w server
      - name: Client tests
        run: npm test -w client
      - name: Analytics tests
        run: npm run test:analytics
      - name: Build web app
        run: npm run build
