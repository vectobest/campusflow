name: Keep API awake

# Render's free plan suspends the API after 15 minutes without traffic and the
# first request then takes ~1 minute. Pinging the health endpoint every 10
# minutes keeps it responsive for participants. (GitHub may delay scheduled
# runs, and pauses them after 60 days without repository activity.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 120 --retry 2 https://campusflow-api-d6h8.onrender.com/api/v1/health
